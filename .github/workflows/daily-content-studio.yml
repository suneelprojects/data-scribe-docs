name: EazyDataFix Daily Content Studio

on:
  schedule:
    # 08:00 Asia/Kolkata every day.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate two review-ready blog drafts
        env:
          CONTENT_STUDIO_CRON_SECRET: ${{ secrets.CONTENT_STUDIO_CRON_SECRET }}
        run: |
          test -n "$CONTENT_STUDIO_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CONTENT_STUDIO_CRON_SECRET" \
            https://eazydatafix.com/api/cron/generate-blog-drafts
