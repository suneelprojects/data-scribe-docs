name: EazyDataFix Instagram Content Studio

on:
  schedule:
    # Four exact UTC schedules for 07:00, 12:30, 18:00 and 23:00 Asia/Kolkata.
    # The server also catches up any earlier missed slot and deduplicates by date + slot key.
    - cron: "30 1,12,17 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eazydatafix-instagram-content-studio
  cancel-in-progress: false

jobs:
  instagram-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate and auto-publish the due Asia/Kolkata Instagram slots
        env:
          CONTENT_CRON_SECRET: ${{ secrets.CONTENT_CRON_SECRET }}
        run: |
          test -n "$CONTENT_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --max-time 780 \
            --request POST \
            --header "Authorization: Bearer $CONTENT_CRON_SECRET" \
            https://eazydatafix.com/api/cron/instagram-studio-tick
