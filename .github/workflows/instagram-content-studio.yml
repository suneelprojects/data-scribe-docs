name: EazyDataFix Instagram Content Studio

on:
  schedule:
    # Every 30 minutes. The server prepares one daily Python education post as a draft
    # for human review and manual approval.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eazydatafix-instagram-content-studio
  cancel-in-progress: false

jobs:
  instagram-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate daily education draft and publish approved scheduled posts
        env:
          CONTENT_CRON_SECRET: ${{ secrets.CONTENT_CRON_SECRET }}
        run: |
          test -n "$CONTENT_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --max-time 540 \
            --request POST \
            --header "Authorization: Bearer $CONTENT_CRON_SECRET" \
            https://eazydatafix.com/api/cron/instagram-studio-tick
