name: EazyDataFix Instagram Content Studio

on:
  schedule:
    # Every 30 minutes. The server creates one daily post draft plus a 30-second
    # Reel draft every two days from 2026-08-22, then publishes only approved items.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eazydatafix-instagram-content-studio
  cancel-in-progress: false

jobs:
  instagram-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate post and Reel drafts, refresh renders, publish approved items
        env:
          CONTENT_STUDIO_CRON_SECRET: ${{ secrets.CONTENT_STUDIO_CRON_SECRET }}
        run: |
          test -n "$CONTENT_STUDIO_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --max-time 540 \
            --request POST \
            --header "Authorization: Bearer $CONTENT_STUDIO_CRON_SECRET" \
            https://eazydatafix.com/api/cron/instagram-studio-tick
