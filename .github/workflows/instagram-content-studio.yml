name: EazyDataFix Instagram Content Studio

on:
  schedule:
    # Every 30 minutes. The server prepares one daily Python education post for
    # automatic publishing at 20:00 IST, plus an approval-gated Reel every two days.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eazydatafix-instagram-content-studio
  cancel-in-progress: false

jobs:
  instagram-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate daily education, refresh Reels, publish due items
        env:
          CONTENT_STUDIO_CRON_SECRET: ${{ secrets.CONTENT_STUDIO_CRON_SECRET }}
        run: |
          test -n "$CONTENT_STUDIO_CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --max-time 540 \
            --request POST \
            --header "Authorization: Bearer $CONTENT_STUDIO_CRON_SECRET" \
            https://eazydatafix.com/api/cron/instagram-studio-tick
